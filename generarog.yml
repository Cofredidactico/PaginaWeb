name: Generar tarjetas para compartir

# Regenera las mini-páginas /p/*.html (tarjetas de WhatsApp/redes por producto)
# cada vez que cambia productos.json. También se puede correr a mano desde
# la pestaña "Actions" con el botón "Run workflow".

on:
  push:
    branches: [ main ]
    paths:
      - 'productos.json'
      - 'scripts/generar-og.mjs'
      - '.github/workflows/generar-og.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-og
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar las tarjetas
        run: node scripts/generar-og.mjs

      - name: Guardar los cambios (si los hay)
        run: |
          if [ -n "$(git status --porcelain p)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add p
            git commit -m "Auto: regenerar tarjetas para compartir (/p)"
            git push
          else
            echo "Sin cambios en /p — nada para commitear."
          fi
